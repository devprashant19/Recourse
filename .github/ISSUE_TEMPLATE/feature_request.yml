name: Feature Request
description: Propose a new feature, improvement, or idea for Recourse
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Recourse! Please provide details about your idea below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the solution or new capability...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which part of Recourse would this feature primarily affect?
      options:
        - Smart Contracts (contracts/)
        - SDK & Packages (packages/)
        - Services & Keepers (services/)
        - Web App (apps/web)
        - Demo & Developer Experience
        - Documentation & Governance
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A description of any alternative solutions, workarounds, or features you have considered.
      placeholder: Other approaches I evaluated...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, diagrams, or mockups about the feature request here.

