[package]
name = "test-token"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Sandbox-only NEP-141 token (6 decimals) standing in for USDC in integration tests"
repository = "https://github.com/devprashant19/Recourse"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
