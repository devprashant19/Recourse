[package]
name = "recourse"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/devprashant19/Recourse"
description = "Bonds, underwriting vaults, TEE-attested receipts, claims and slashing for AI agents on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` exposes `env::ecrecover`, which `submit_receipt` uses to check TEE
# signatures on-chain. Without it the receipt check cannot be built at all.
near-sdk = { version = "5.29", features = ["unstable"] }
near-contract-standards = "5.29"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# 256-bit intermediates for mul-div: yocto amounts (~1e25) times share counts
# (~1e25) overflow u128. Same version nearcore already pulls in.
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unstable", "unit-testing"] }
proptest = "1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
near-workspaces = "0.16"
anyhow = "1"
# Same version near-sdk's unit-testing mock uses; lets tests feed promise
# results (e.g. a failed transfer) into callbacks via `testing_env!`.
near-parameters = "0.38"
# Signs real EIP-191 receipts in the invariant harness (already in the tree).
secp256k1 = { version = "0.27", features = ["recovery"] }

# The spec places the property harness in the repo-level tests/invariants/.
[[test]]
name = "invariants"
path = "../../tests/invariants/main.rs"
