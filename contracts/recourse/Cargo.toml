[package]
name = "recourse"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/devprashant19/Recourse"
description = "Bonds, underwriting vaults, TEE-attested receipts, claims and slashing for AI agents on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` exposes `env::ecrecover`, which `submit_receipt` uses to check TEE
# signatures on-chain. Without it the receipt check cannot be built at all.
near-sdk = { version = "5.29", features = ["unstable"] }
near-contract-standards = "5.29"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unstable", "unit-testing"] }
proptest = "1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
near-workspaces = "0.16"
anyhow = "1"
