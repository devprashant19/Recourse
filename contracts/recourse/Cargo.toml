[package]
name = "recourse"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/REPLACE_ME/recourse"
description = "Bonds, underwriting vaults, TEE-attested receipts, claims and slashing for AI agents on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
proptest = "1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
near-workspaces = "0.16"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
